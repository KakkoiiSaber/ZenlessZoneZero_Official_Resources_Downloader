name: Downloader checks
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: sh -n run-downloader.sh
      - run: docker compose config --quiet
      - run: docker compose -f compose.wiki.yaml config --quiet
      - name: Build the dependency runtime with its input signature
        run: |
          runtime_signature=$(git hash-object Dockerfile requirements-download.txt .dockerignore | git hash-object --stdin)
          docker compose build --build-arg "RUNTIME_SIGNATURE=$runtime_signature"
          test "$(docker image inspect --format '{{index .Config.Labels "io.github.kakkoiisaber.zzz.runtime-signature"}}' downloader:runtime)" = "$runtime_signature"
      - name: Verify the runtime image contains dependencies but no application code
        run: >-
          docker run --rm --network none --entrypoint python downloader:runtime
          -c "import pathlib, requests; from PIL import Image; assert not pathlib.Path('/app/src').exists()"
      - name: Validate the real manifest inside the non-root container
        run: >-
          docker compose run --rm --no-deps
          -v "$PWD/metafiles/wiki.json:/manifest/wiki.json:ro"
          downloader --manifest-file /manifest/wiki.json --dry-run
      - name: Verify the container exits after one run without scheduling flags
        run: |
          printf '%s\n' '{"schema_version":2,"source":"wiki","entries":{}}' > "$RUNNER_TEMP/empty-wiki.json"
          timeout 30s docker run --rm --network none --read-only \
            --tmpfs /downloads:uid=1000,gid=1000,mode=0700 \
            --tmpfs /state:uid=1000,gid=1000,mode=0700 \
            -v "$PWD/src:/app/src:ro" \
            -v "$RUNNER_TEMP/empty-wiki.json:/manifest/wiki.json:ro" \
            downloader:runtime --manifest-file /manifest/wiki.json
      - name: Verify a source update is visible without rebuilding the image
        run: |
          mkdir -p "$RUNNER_TEMP/live-source/src"
          printf '%s\n' 'print("source-v1")' > "$RUNNER_TEMP/live-source/src/download.py"
          docker run --rm --network none -v "$RUNNER_TEMP/live-source/src:/app/src:ro" downloader:runtime | grep -Fx source-v1
          printf '%s\n' 'print("source-v2")' > "$RUNNER_TEMP/live-source/src/download.py"
          docker run --rm --network none -v "$RUNNER_TEMP/live-source/src:/app/src:ro" downloader:runtime | grep -Fx source-v2
