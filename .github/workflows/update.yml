name: Metadata Update

on:
  workflow_dispatch:
    inputs:
      refresh_legacy:
        description: Also refresh preserved post/Minas metadata (never download media)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: asset-update
  cancel-in-progress: false

env:
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/downloads/
            !/docs/thumbs/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install metadata and test dependencies
        run: pip install -r requirements-metadata.txt
      - name: Install browser for offline regression fixtures
        run: python -m playwright install --with-deps chromium
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Refresh public catalog without media transfers
        id: catalog
        if: ${{ inputs.refresh_legacy }}
        continue-on-error: true
        run: python -u tools/collect_metadata.py --refresh-posts
      - name: Update Wiki index, knowledge and cached-preview classification
        id: resources
        continue-on-error: true
        run: python -u tools/collect_resources.py --max-details 12
      - name: Checkpoint public metadata only
        run: python tools/checkpoint_metadata.py
      - name: Report incomplete sources
        if: ${{ steps.resources.outcome != 'success' || (inputs.refresh_legacy && steps.catalog.outcome != 'success') }}
        run: |
          echo 'Some metadata sources failed; inspect resource-status.json and catalog-status.json. Previous successful entries and all media are retained.'
          exit 1
