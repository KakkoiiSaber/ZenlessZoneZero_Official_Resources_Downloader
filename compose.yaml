services:
  downloader:
    build: .
    image: downloader:runtime
    user: "${NAS_UID:-1000}:${NAS_GID:-1000}"
    init: true
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      MANIFEST_URL: "${MANIFEST_URL:-https://raw.githubusercontent.com/KakkoiiSaber/zzz_scraper/main/metafiles/wiki.json}"
      VERIFY_DAYS: "${VERIFY_DAYS:-7}"
    volumes:
      - type: bind
        source: ./src
        target: /app/src
        read_only: true
        bind:
          create_host_path: false
      - "${DOWNLOAD_PATH:-./downloads}:/downloads"
      - "${STATE_PATH:-./state}:/state"
    stop_grace_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
