<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>绝区零 · 资源目录</title>
  <style>
    :root{color-scheme:dark;--bg:#0a0d12;--card:#111826;--line:#293a51;--text:#e7ecf4;--muted:#a8bbd3}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,"Noto Sans SC",sans-serif}
    main{max-width:1280px;margin:auto;padding:24px}a{color:#a7cdff;overflow-wrap:anywhere}nav{display:flex;gap:20px;flex-wrap:wrap}h1{font-size:28px;margin:20px 0 4px}.intro,.muted{color:var(--muted)}
    form{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}label{display:flex;flex-direction:column;gap:6px;min-width:150px}.search{flex:1;min-width:180px}input,select,button{min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit}button{align-self:end;cursor:pointer}:focus-visible{outline:2px solid #9bc6ff;outline-offset:3px}
    #catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}article{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}h2{font-size:18px;margin:0 0 8px;overflow-wrap:anywhere}.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.tag{font-size:12px;padding:2px 7px;background:#1b2b40;border:1px solid #304660;border-radius:5px}.inferred{border-style:dashed;color:#f2ce91}.sources{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}.state{font-size:13px;color:var(--muted)}summary{cursor:pointer;padding:6px 0}li{margin:6px 0}.empty{padding:20px}.warning{color:#f2ce91}
    @media(max-width:600px){main{padding:16px}#catalog{grid-template-columns:1fr}form label{flex:1;min-width:125px}h1{font-size:24px}}
  </style>
</head>
<body><main>
  <nav aria-label="图库导航"><a href="index.html">图片预览</a><a href="resources.html" aria-current="page">资源目录</a></nav>
  <h1>绝区零 · 资源目录</h1>
  <p class="intro">按角色、内容类型与版本查找官方资源。保留 Wiki、官网及原帖出处；合集标签表示收录内容，单张图片以各自小节为准。</p>
  <form id="resourceFilters" aria-label="筛选资源">
    <label>内容分类<select id="resourceCategory"><option value="">全部分类</option></select></label>
    <label>版本<select id="resourceVersion"><option value="">全部版本</option></select></label>
    <label class="search">关键词<input type="search" id="resourceSearch" placeholder="角色、PV、EP、月历或版本名称"></label>
    <button type="button" id="resourceClear">清除筛选</button>
  </form>
  <p id="resourceStatus" role="status" aria-live="polite">正在加载目录…</p>
  <section id="catalog" aria-label="资源条目"></section>
  <script src="resources.js" defer></script>
</main></body></html>
