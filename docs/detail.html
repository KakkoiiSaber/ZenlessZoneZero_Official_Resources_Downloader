<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Image Detail</title>
  <style>
    :root {
      --bg: #0a0d12;
      --card: #111826;
      --border: #1c2737;
      --text: #e7ecf4;
      --muted: #9fb4ce;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Noto Sans SC", system-ui, -apple-system, sans-serif;
      padding: 16px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.28);
    }
    img {
      max-width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
      margin: 0 auto 12px;
    }
    .meta {
      font-size: 14px;
      color: var(--muted);
      word-break: break-all;
    }
    a { color: var(--muted); }
    a:hover { color: var(--text); }
    .actions {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    .btn {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
    }
    .btn:hover { border-color: var(--text); }
    .tags { display:flex; flex-wrap:wrap; gap:7px; margin:12px 0; }
    .tag { padding:4px 8px; border:1px solid #304660; border-radius:6px; background:#1b2b40; color:#c9d9ef; font-size:13px; }
    .tag-inferred { color:#f2ce91; border-style:dashed; border-color:#8c7042; background:#322a1d; }
    .actions { flex-wrap:wrap; }

  </style>
</head>
<body>
  <div class="container" id="container">
    <div class="actions">
      <a class="btn" href="index.html">← Back to gallery</a>
      <a class="btn" id="fullLink" href="#" target="_blank" rel="noopener">打开预览</a>
      <a class="btn" id="originalLink" href="#" target="_blank" rel="noopener" hidden>下载原图</a>
    </div>
    <img id="img" alt="" />
    <div class="meta" id="meta"></div>
    <div class="tags" id="tags" role="list" aria-label="图片标签"></div>
    <details class="meta" id="tagEvidence" hidden><summary>查看标签依据</summary><ul id="tagEvidenceList"></ul></details>
    <details class="meta" id="sources" hidden><summary>查看来源与关联帖子</summary><ul id="sourceList"></ul></details>
  </div>
  <script>
    function getIndex() {
      const params = new URLSearchParams(window.location.search);
      const i = parseInt(params.get('i') || '-1', 10);
      return isNaN(i) ? -1 : i;
    }

    async function load() {
      const idx = getIndex();
      const imageId = new URLSearchParams(location.search).get("id");
      const imgEl = document.getElementById('img');
      const metaEl = document.getElementById('meta');
      const linkEl = document.getElementById('fullLink');
      if (idx < 0 && !imageId) {
        metaEl.textContent = 'Invalid image index.';
        return;
      }
      try {
        const res = await fetch('meta.json?_=' + Date.now());
        const data = await res.json();
        const items = data.items || [];
        const resolvedId = imageId || data.legacy_indices?.[String(idx)];
        const it = resolvedId ? items.find(item => item.identity === resolvedId) : items[idx];
        if (!it) {
          metaEl.textContent = 'Image not found.';
          return;
        }
        const full = it.full || it.thumb;
        imgEl.src = it.thumb;
        imgEl.alt = it.name || '图片预览';
        linkEl.href = full;
        linkEl.textContent = '打开预览';
        if (it.download && /^https:\/\//.test(it.download)) {
          document.getElementById('originalLink').href = it.download;
          document.getElementById('originalLink').hidden = false;
        }
        metaEl.textContent = [it.name || '', (it.categories || ['未分类']).join(' / ')].filter(Boolean).join(' · ');
        for (const tag of it.tags || []) {
          const chip = document.createElement('span'); chip.className = 'tag' + (tag.confidence === 'inferred' ? ' tag-inferred' : '');
          chip.textContent = tag.label; chip.setAttribute('role', 'listitem'); document.getElementById('tags').append(chip);
          for (const evidence of tag.evidence || []) {
            const li = document.createElement('li');
            li.textContent = tag.label + (tag.confidence === 'inferred' ? '：角色登场关联，非图片首次发布版本。' :
              tag.confidence === 'rule_supported' ? '：官方角色展示/PV标题与图片目录规则支持的首登场内容关联。' : '：来源文字明确标注。');
            if (evidence.rule_id) li.append(' 规则：' + evidence.rule_id);
            if (evidence.asset_path) li.append(' 目录：' + evidence.asset_path);
            if (evidence.source_url && /^https:\/\//.test(evidence.source_url)) {
              const source = document.createElement('a'); source.href = evidence.source_url; source.target = '_blank'; source.rel = 'noopener'; source.textContent = '查看来源'; li.append(' ', source);
            } else if (evidence.value) { li.append(' ', document.createTextNode(evidence.value)); }
            if (evidence.mapping_source_url && /^https:\/\//.test(evidence.mapping_source_url)) {
              const mapping = document.createElement('a'); mapping.href = evidence.mapping_source_url; mapping.target = '_blank'; mapping.rel = 'noopener'; mapping.textContent = '角色登场依据'; li.append(' ', mapping);
            }
            document.getElementById('tagEvidenceList').append(li);
          }
        }
        document.getElementById('tagEvidence').hidden = !document.getElementById('tagEvidenceList').children.length;
        const params = new URLSearchParams(location.search);
        params.delete('i');
        params.delete('id');
        document.querySelector('.actions a').href = 'index.html' + (params.size ? '?' + params : '');
        const posts = new Map((it.posts || []).map(post => [post.post_id, post]));
        for (const post of posts.values()) {
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.textContent = post.title + '（分享目录包含此图片）';
          if (/^https:\/\//.test(post.post_url)) { a.href = post.post_url; a.target = '_blank'; a.rel = 'noopener'; }
          li.append(a); document.getElementById('sourceList').append(li);
        }
        document.getElementById('sources').hidden = posts.size === 0;
      } catch (e) {
        metaEl.textContent = 'Failed to load image.';
        console.error(e);
      }
    }
    load();
  </script>
</body>
</html>
