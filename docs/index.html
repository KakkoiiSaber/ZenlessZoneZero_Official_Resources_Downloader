<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Downloads Gallery</title>
  <style>
    :root {
      --bg: #0a0d12;
      --card: #111826;
      --border: #1c2737;
      --text: #e7ecf4;
      --muted: #9fb4ce;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Noto Sans SC", system-ui, -apple-system, sans-serif;
    }
    header {
      padding: 16px 20px 6px;
      font-weight: 600;
      font-size: 18px;
    }
    header .count { color: var(--muted); font-weight: 400; margin-left: 12px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
      grid-auto-rows: 4px;
      grid-auto-flow: dense;
      gap: 12px;
      padding: 0 12px 32px;
    }
    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    }
    @media (max-width: 640px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
    }
    .card {
      background: transparent;
      border: none;
      border-radius: 12px;
      overflow: hidden;
    }
    .card img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: inherit;
    }
    .filters { display:flex; flex-wrap:wrap; gap:12px; padding:12px 20px; align-items:end; }
    .filters label { display:flex; flex-direction:column; gap:6px; color:var(--muted); font-size:13px; }
    .filters select, .filters input, .filters button { min-height:42px; border:1px solid #344459; border-radius:8px; background:var(--card); color:var(--text); padding:9px 12px; font:inherit; }
    .filters select { min-width:150px; }
    .filters .search { flex:1; min-width:190px; }
    .filters button { cursor:pointer; }
    .filters :focus-visible { outline:2px solid #81b8ff; outline-offset:3px; }
    .status { color:var(--muted); font-size:14px; margin:0 20px 16px; }
    .card a { color:var(--text); text-decoration:none; display:block; }
    .caption { background:var(--card); padding:10px 12px; font-size:13px; line-height:1.5; }
    .version-badge { color:#a7cdff; margin-right:8px; }
    .card-name { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .empty { padding: 18px; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <header>Downloads Gallery<span class="count">0</span></header>
  <form class="filters" id="filters" aria-label="筛选图片">
    <label>版本<select id="versionFilter" name="version"><option value="">全部版本</option></select></label>
    <label>分类<select id="categoryFilter" name="category"><option value="">全部分类</option></select></label>
    <label class="search">搜索<input id="searchFilter" name="q" type="search" placeholder="文件名、帖子或目录" /></label>
    <button id="clearFilters" type="button">显示全部图片</button>
  </form>
  <p class="status" id="filterStatus" role="status" aria-live="polite">正在加载图片…</p>
  <section class="grid" id="grid" aria-label="图片预览">
    <p class="empty" id="loading">Loading…</p>
  </section>
  <div id="sentinel" style="height: 1px;"></div>
  <script src="gallery.js" defer></script>
</body>
</html>
